<main class="page-container">
  @if (errorMessage()) {
    <div class="error-alert glass">
      <span>❌ {{ errorMessage() }}</span>
      <button class="btn-close" (click)="errorMessage.set(null)">×</button>
    </div>
  }

  @if (!showForm()) {
    <app-generic-table
      [columns]="columns"
      [data]="records()"
      [totalRecords]="totalRecords()"
      (create)="onAdd()"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
      (pageChange)="loadRecords()"
      (refresh)="loadRecords()"
    ></app-generic-table>
  } @else {
    <app-generic-form
      [mode]="formMode()"
      [columns]="columns"
      [initialData]="selectedRecord() || {}"
      (formSubmit)="onFormSubmit($event)"
      (formCancel)="onFormCancel()"
    ></app-generic-form>
  }
</main>
